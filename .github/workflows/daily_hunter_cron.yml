name: OptionMargin CI & Daily Hunter Cron

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  verify-and-hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 8 Golden Edge Cases Test Suite
        run: pytest -v

      - name: Trigger Daily USAspending & SAM.gov Prospect Sniper
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python -c "from app.main import create_prospect_audit; print(create_prospect_audit())"
