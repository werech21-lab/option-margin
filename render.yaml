databases:
  - name: optionmargin-db
    databaseName: optionmargin
    user: optionmargin
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: optionmargin-engine
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: optionmargin-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        value: https://optionmargin-engine.onrender.com
      - key: PII_HMAC_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: cron
    name: optionmargin-daily-hunter
    runtime: python
    schedule: "0 11 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from app.database import init_db, SessionLocal; from app.main import run_live_sniper_pipeline; init_db(); db = SessionLocal(); print(run_live_sniper_pipeline(limit=5, recipient_email='werech21@gmail.com', db=db))"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: optionmargin-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        value: https://optionmargin-engine.onrender.com
